# sangbay_node: one module at the factory address on `port` (the launch argument).
# For several sensors see example_multi.yaml.

rate: 1.0            # Hz, module polling (lasers publish every frame they send)
timeout: 0.3         # s, per Modbus answer
retries: 2           # extra tries per register
reconnect_sec: 2.0   # wait before reopening a port
max_failures: 3      # failed readings in a row before a module's info is read again /
                     # the port is reopened (no module answers, no laser data)

sensors:
  - name: h2s
    address: 255         # factory default
    expected_gas: H2S    # warn if the module reports another gas
